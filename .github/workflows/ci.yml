name: Build and Test
on:
  push:
    branches: [main, apex/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (MCP/freshness)
        run: npm run test:integration
      - name: Security tests
        run: npm run test:security
      - name: Installer tests
        run: npm run test:installer
      - name: smoke:mcp
        run: npm run smoke:mcp
      - name: demo
        run: npm run demo
      - name: bench
        run: npm run bench
      - name: Package dry-run
        run: npm pack --dry-run
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit installed dependency graph (high+)
        run: npm audit --audit-level=high
