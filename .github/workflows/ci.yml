name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: All tests
        run: npm test
      - name: MCP protocol integration
        run: npm run test:integration
      - name: Source safety tests
        run: npm run test:security
      - name: Installer rollback tests
        run: npm run test:installer
      - name: Guard behavior
        run: npm run test:guard
      - name: Real-client smoke
        run: npm run smoke:mcp
      - name: Isolated recruiter demo
        run: npm run demo
      - name: Deterministic benchmarks
        run: npm run bench
      - name: Package contents
        run: npm pack --dry-run
      - name: Installed tarball binary smoke
        run: npm run smoke:package
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit dependency graph
        run: npm audit --audit-level=high

  opencode-client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: v1
            package: opencode-ai@1.19.5
          # OpenCode V2 is intentionally not advertised as supported until its
          # cold-start MCP catalog bug is fixed in a verified stable release.
          # V1 remains a required, real CLI tool-call integration test.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Locked dependency installation
        run: npm ci --ignore-scripts --no-fund
      - name: Build MCP server
        run: npm run build
      - name: Install pinned real OpenCode CLI in temporary prefix
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          mkdir -p "$RUNNER_TEMP/apex-opencode-cli"
          npm install --prefix "$RUNNER_TEMP/apex-opencode-cli" --no-save --no-audit --no-fund "$PACKAGE_NAME"
      - name: Verify OpenCode MCP connection AND real tool invocations
        env:
          OPENCODE_BIN: ${{ runner.temp }}/apex-opencode-cli/node_modules/.bin/opencode
          CLIENT_NAME: ${{ matrix.client }}
        run: npm run smoke:opencode -- --client "$CLIENT_NAME"
