name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No package-lock.json is committed yet. This is a verification gate,
      # not a claim of reproducible installs. Lockfile follow-up is required.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run fixture tests
        run: npm test
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve dependencies
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Audit installed dependency graph
        run: npm audit --audit-level=high
      - name: Retain generated lockfile for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
