name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: All tests
        run: npm test
      - name: MCP protocol integration
        run: npm run test:integration
      - name: Source safety tests
        run: npm run test:security
      - name: Installer rollback tests
        run: npm run test:installer
      - name: Guard behavior
        run: npm run test:guard
      - name: Real-client smoke
        run: npm run smoke:mcp
      - name: Isolated recruiter demo
        run: npm run demo
      - name: Deterministic benchmarks
        run: npm run bench
      - name: Package contents
        run: npm pack --dry-run
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Audit dependency graph
        run: npm audit --audit-level=high
